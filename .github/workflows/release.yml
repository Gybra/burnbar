name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build and bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BUILD=$(git rev-list --count HEAD)
          scripts/bundle.sh "$VERSION" "$BUILD"

      - name: Archive
        run: tar -czf BurnBar.app.tar.gz -C dist BurnBar.app

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" BurnBar.app.tar.gz \
            --title "BurnBar ${GITHUB_REF_NAME#v}" \
            --generate-notes
